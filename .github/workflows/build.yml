name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        korge: ["4.0.9", "5.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Set Korge version
        run: sed -i -E 's/version "[0-9.]+"/version "${{ matrix.korge }}"/' build.gradle.kts
      - name: Compile JVM
        run: |
          set -o pipefail
          gradle compileKotlinJvm --stacktrace 2>&1 | tee compile-${{ matrix.korge }}.log
      - name: Build APK
        continue-on-error: true
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --stacktrace 2>&1 | tee apk-${{ matrix.korge }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-korge-${{ matrix.korge }}
          path: |
            *.log
            **/*.apk
          if-no-files-found: ignore
